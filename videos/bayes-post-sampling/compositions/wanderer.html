<!doctype html>
<html lang="de">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: Inter, sans-serif; color: var(--color-ink, #f2f2f2); }
        #wd-stage { position: absolute; inset: 0; opacity: 0; }
        #wd-head { position: absolute; left: 96px; top: 54px; font-size: 56px; font-weight: 700; letter-spacing: -0.02em; }
        #wd-svg { position: absolute; left: 96px; top: 130px; width: 1728px; height: 900px; }
        #wd-steps { position: absolute; left: 96px; top: 54px; width: 1728px; text-align: right; font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; opacity: 0; }
        #wd-steps span { color: var(--color-muted, #9a9da6); font-weight: 500; }
        #wd-passt { position: absolute; left: 96px; top: 54px; width: 1728px; text-align: right; font-size: 40px; font-weight: 700; color: var(--color-green, #009e73); opacity: 0; }
        .wd-t { font-family: Inter; }
      </style>
      <div id="root" data-composition-id="wanderer" data-width="1920" data-height="1080">
        <div id="wd-stage">
          <div id="wd-head">Der Wanderer im Nebel</div>
          <div id="wd-steps">Schritte: <b id="wd-n">0</b> <span>von 10 000</span></div>
          <div id="wd-passt">✓ Stapel des Wanderers ≈ Post-Verteilung</div>
          <svg id="wd-svg" viewBox="0 0 1728 900"></svg>
        </div>
      </div>
      <script>
        (() => {
          const L = window.__LIB, D = window.__DATA;
          const S = window.__CUES.scenes.wanderer, C = S.cues, END = S.duration;
          const tl = gsap.timeline({ paused: true });
          const svg = document.getElementById("wd-svg");

          // Landschaft (oben) und Stapel (unten)
          const lx = 60, ly = 40, lw = 1600, lh = 380; // Landschaftsbox
          const hx = 60, hy = 560, hw = 1600, hh = 260; // Histogrammbox
          const px = (p) => lx + lw * p;
          const py = (hgt) => ly + lh - lh * hgt;

          const land = L.el("g", { opacity: 0 }, svg);
          L.el("path", { d: L.curvePath(D.curve, lx, ly, lw, lh, true), fill: "#1E3D52" }, land);
          const landLine = L.el("path", { d: L.curvePath(D.curve, lx, ly, lw, lh), fill: "none", stroke: "#56B4E9", "stroke-width": 5, "stroke-linejoin": "round" }, land);
          L.el("line", { x1: lx, y1: ly + lh, x2: lx + lw, y2: ly + lh, stroke: "#9A9DA6", "stroke-width": 3 }, land);
          [0, 0.25, 0.5, 0.75, 1].forEach((p) => {
            L.el("text", { x: px(p), y: ly + lh + 36, fill: "#9A9DA6", "font-size": 28, "text-anchor": "middle", class: "wd-t" }, land).textContent = L.pct(p);
          });
          const xlab = L.el("text", { x: lx + lw, y: ly + lh + 74, fill: "#9A9DA6", "font-size": 28, "text-anchor": "end", class: "wd-t", opacity: 0 }, svg);
          xlab.textContent = "jede Stelle = ein Parameterwert p";
          const ylab = L.el("text", { x: lx + 8, y: ly - 14, fill: "#9A9DA6", "font-size": 28, class: "wd-t", opacity: 0 }, svg);
          ylab.textContent = "Höhe = Posteriori-Wahrscheinlichkeit";
          // Markierungen hoch / niedrig
          const hiBand = L.el("rect", { x: px(0.55), y: ly - 10, width: px(0.8) - px(0.55), height: lh + 10, fill: "#E69F00", "fill-opacity": 0.14, opacity: 0 }, svg);
          const loBand = L.el("rect", { x: px(0.05), y: ly - 10, width: px(0.32) - px(0.05), height: lh + 10, fill: "#9A9DA6", "fill-opacity": 0.14, opacity: 0 }, svg);
          // Nebel
          const fog = L.el("rect", { x: lx - 20, y: ly - 4, width: lw + 40, height: lh - 6, fill: "#F2F2F2", opacity: 0 }, svg);
          const fogLabel = L.el("text", { x: lx + lw / 2, y: ly + 50, fill: "#16181D", "font-size": 34, "font-weight": 700, "text-anchor": "middle", class: "wd-t", opacity: 0 }, svg);
          fogLabel.textContent = "Nebel: die Landschaft ist unsichtbar";

          // Höhenvergleich (Panel oben rechts, über dem Nebel)
          const panel = L.el("g", { opacity: 0 }, svg);
          const pxp = 1250, pyp = 60, barH = 200;
          L.el("rect", { x: pxp - 30, y: pyp - 20, width: 400, height: barH + 90, rx: 14, fill: "#16181D", stroke: "#2A2D35", "stroke-width": 3 }, panel);
          const barHere = L.el("rect", { x: pxp + 40, y: pyp + barH, width: 90, height: 0, fill: "#E69F00", rx: 4 }, panel);
          const barThere = L.el("rect", { x: pxp + 210, y: pyp + barH, width: 90, height: 0, fill: "#9A9DA6", rx: 4 }, panel);
          L.el("line", { x1: pxp, y1: pyp + barH, x2: pxp + 340, y2: pyp + barH, stroke: "#9A9DA6", "stroke-width": 2 }, panel);
          L.el("text", { x: pxp + 85, y: pyp + barH + 36, fill: "#F2F2F2", "font-size": 28, "text-anchor": "middle", class: "wd-t", "font-weight": 700 }, panel).textContent = "hier";
          L.el("text", { x: pxp + 255, y: pyp + barH + 36, fill: "#F2F2F2", "font-size": 28, "text-anchor": "middle", class: "wd-t", "font-weight": 700 }, panel).textContent = "dort";
          const verdict = L.el("text", { x: pxp + 170, y: pyp + 30, fill: "#009E73", "font-size": 30, "text-anchor": "middle", class: "wd-t", "font-weight": 700, opacity: 0 }, panel);

          // Stapel-Achse (unten)
          const hist = L.el("g", { opacity: 0 }, svg);
          L.el("line", { x1: hx, y1: hy + hh, x2: hx + hw, y2: hy + hh, stroke: "#9A9DA6", "stroke-width": 3 }, hist);
          [0, 0.25, 0.5, 0.75, 1].forEach((p) => {
            L.el("text", { x: hx + hw * p, y: hy + hh + 36, fill: "#9A9DA6", "font-size": 28, "text-anchor": "middle", class: "wd-t" }, hist).textContent = L.pct(p);
          });
          const histLabel = L.el("text", { x: hx + 8, y: hy - 12, fill: "#9A9DA6", "font-size": 28, class: "wd-t" }, hist);
          histLabel.textContent = "Wo der Wanderer stand (Stapel seiner Standorte)";
          const nb = D.hist.length, bwid = hw / nb;
          const bins = D.hist.map((v, i) => L.el("rect", { x: hx + i * bwid + 2, y: hy + hh, width: bwid - 4, height: 0, fill: "#E69F00", rx: 3 }, hist));
          const setBins = (vals) => bins.forEach((b, i) => { const hgt = hh * vals[i]; b.setAttribute("y", hy + hh - hgt); b.setAttribute("height", hgt); });
          const dots = [0.37, 0.33, 0.33].map((p, i) => L.el("circle", { cx: hx + hw * p, cy: hy + hh - 10 - i * 14, r: 8, fill: "#E69F00", opacity: 0 }, hist));
          const hiBand2 = L.el("rect", { x: hx + hw * 0.55, y: hy - 10, width: hw * 0.25, height: hh + 10, fill: "#E69F00", "fill-opacity": 0.14, opacity: 0 }, svg);
          const loBand2 = L.el("rect", { x: hx + hw * 0.05, y: hy - 10, width: hw * 0.27, height: hh + 10, fill: "#9A9DA6", "fill-opacity": 0.14, opacity: 0 }, svg);
          const histCurve = L.el("path", { d: L.curvePath(D.curve, hx + bwid / 2, hy, hw - bwid, hh), fill: "none", stroke: "#56B4E9", "stroke-width": 6, "stroke-linecap": "round", opacity: 0 }, svg);
          const hclen = L.dashDraw(histCurve);

          // Wanderer-Figur (Fußpunkt bei 0,0)
          const fig = L.el("g", { opacity: 0 }, svg);
          L.el("circle", { cx: 0, cy: -46, r: 12, fill: "#E69F00" }, fig);
          L.el("line", { x1: 0, y1: -32, x2: 0, y2: -6, stroke: "#E69F00", "stroke-width": 6, "stroke-linecap": "round" }, fig);
          L.el("path", { d: "M0 -6 L-12 2 M0 -6 L12 2", fill: "none", stroke: "#E69F00", "stroke-width": 6, "stroke-linecap": "round" }, fig);
          L.el("path", { d: "M-14 -22 L0 -28 L14 -16", fill: "none", stroke: "#E69F00", "stroke-width": 6, "stroke-linecap": "round" }, fig);
          const setFig = (p) => { fig.setAttribute("transform", `translate(${px(p).toFixed(1)} ${py(L.height(p)).toFixed(1)}) scale(1.35)`); };
          setFig(0.3);
          // Höhenmesser
          const gauge = L.el("g", { opacity: 0 }, svg);
          const gaugeBg = L.el("rect", { x: 0, y: 0, width: 150, height: 44, rx: 8, fill: "#16181D", stroke: "#E69F00", "stroke-width": 2 }, gauge);
          const gaugeTxt = L.el("text", { x: 75, y: 31, fill: "#E69F00", "font-size": 28, "text-anchor": "middle", class: "wd-t", "font-weight": 700 }, gauge);
          const setGauge = (p) => { gauge.setAttribute("transform", `translate(${(px(p) - 75).toFixed(1)} ${(py(L.height(p)) - 110).toFixed(1)})`); gaugeTxt.textContent = "Höhe " + L.fmtDe(L.height(p), 2); };
          setGauge(0.3);
          // Vorschlagspfeile für die Zeitlupe
          const demo = [
            { from: 0.3, to: 0.37, kind: "up" },
            { from: 0.37, to: 0.33, kind: "down" },
            { from: 0.33, to: 0.12, kind: "deep" },
          ];
          const arrows = demo.map((d) => {
            const g = L.el("g", { opacity: 0 }, svg);
            const x1 = px(d.from), y1 = py(L.height(d.from)) - 20, x2 = px(d.to), y2 = py(L.height(d.to)) - 20;
            L.el("line", { x1, y1, x2, y2, stroke: "#F2F2F2", "stroke-width": 4, "stroke-dasharray": "10 8" }, g);
            L.el("circle", { cx: x2, cy: y2 + 20, r: 10, fill: "none", stroke: "#F2F2F2", "stroke-width": 3 }, g);
            const lbl = L.el("text", { x: x2, y: y2 - 24, fill: "#F2F2F2", "font-size": 28, "text-anchor": "middle", class: "wd-t" }, g);
            lbl.textContent = "Vorschlag";
            return g;
          });
          const deepLabel = L.el("text", { x: px(0.12), y: py(0) - 120, fill: "#9A9DA6", "font-size": 28, "text-anchor": "middle", class: "wd-t", "font-weight": 700, opacity: 0 }, svg);
          deepLabel.textContent = "tief unten → sehr selten";

          // --- Timeline ---
          tl.fromTo("#wd-stage", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 0);
          tl.fromTo("#wd-head", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power4.out" }, 0.2);
          tl.to(land, { opacity: 1, duration: 0.8, ease: "power2.out" }, C.landschaft);
          tl.to(xlab, { opacity: 1, duration: 0.4 }, C.stelle);
          tl.to(ylab, { opacity: 1, duration: 0.4 }, C.hoehe);
          tl.to(fog, { opacity: 0.6, duration: 1.2, ease: "power2.inOut" }, C.nebel);
          tl.to(fogLabel, { opacity: 1, duration: 0.4 }, C.nebel + 0.8);
          tl.to([xlab, ylab], { opacity: 0.75, duration: 0.5 }, C.nebel);
          tl.to(fig, { opacity: 1, duration: 0.4 }, C.wanderer);
          tl.to(gauge, { opacity: 1, duration: 0.4 }, C.hoehenmesser);
          tl.to(fogLabel, { opacity: 0, duration: 0.3 }, C.vor);
          tl.to(panel, { opacity: 1, duration: 0.4 }, C.schritt);
          // Zeitlupe: drei Schritte
          const stepAt = (t, d, idx, accept, label) => {
            const hHere = L.height(d.from), hThere = L.height(d.to);
            tl.to(arrows[idx], { opacity: 1, duration: 0.3 }, t);
            tl.to(barHere, { attr: { height: barH * hHere, y: pyp + barH - barH * hHere }, duration: 0.4 }, t + 0.2);
            tl.to(barThere, { attr: { height: barH * hThere, y: pyp + barH - barH * hThere }, duration: 0.4 }, t + 0.4);
            tl.add(() => { verdict.textContent = label; verdict.setAttribute("fill", accept ? "#009E73" : "#9A9DA6"); }, t + 0.9);
            tl.fromTo(verdict, { opacity: 0 }, { opacity: 1, duration: 0.3 }, t + 0.9);
            if (accept) {
              const proxy = { p: d.from };
              tl.to(proxy, { p: d.to, duration: 0.5, ease: "power2.out", onUpdate: () => { setFig(proxy.p); setGauge(proxy.p); } }, t + 1.4);
            } else {
              tl.to(fig, { x: 0, duration: 0.3 }, t + 1.4); // bleibt stehen
            }
            tl.to(arrows[idx], { opacity: 0, duration: 0.3 }, t + 2.2);
            tl.to(verdict, { opacity: 0, duration: 0.2 }, t + 2.4);
          };
          stepAt(C.bergauf, demo[0], 0, true, "höher → immer ✓");
          stepAt(C.bergab, demo[1], 1, true, "niedriger → manchmal ✓");
          stepAt(C.tiefer, demo[2], 2, false, "viel tiefer → fast nie ✗");
          tl.to(deepLabel, { opacity: 1, duration: 0.3 }, C.tiefer + 0.9);
          tl.to(deepLabel, { opacity: 0, duration: 0.3 }, C.tiefer + 2.6);
          // notieren: Stapelachse + erste Punkte
          tl.to(hist, { opacity: 1, duration: 0.5 }, C.notiert);
          tl.to(dots, { opacity: 1, duration: 0.3, stagger: 0.25 }, C.notiert + 0.4);
          tl.to(panel, { opacity: 0, duration: 0.4 }, C.notiert);
          // Zeitraffer
          tl.fromTo("#wd-steps", { opacity: 0 }, { opacity: 1, duration: 0.3 }, C.tausende);
          tl.to(dots, { opacity: 0, duration: 0.2 }, C.tausende);
          const run = { i: 0 };
          const nEl = document.getElementById("wd-n");
          const steps = D.histSteps, perStep = 250;
          tl.to(run, {
            i: D.walk.length - 1, duration: 7.0, ease: "none",
            onUpdate: () => {
              const i = Math.round(run.i);
              const p = D.walk[i];
              setFig(p); setGauge(p);
              nEl.textContent = L.fmtInt(i);
              const k = Math.min(steps.length - 2, Math.floor(i / perStep));
              const f = Math.min(1, (i - k * perStep) / perStep);
              setBins(steps[k].map((v, b) => v + (steps[k + 1][b] - v) * f));
            },
          }, C.tausende + 0.2);
          tl.to(gauge, { opacity: 0, duration: 0.3 }, C.tausende + 7.0);
          // Ergebnis
          tl.to(fog, { opacity: 0.18, duration: 1.0 }, C.herauskommt);
          tl.to([xlab, ylab], { opacity: 1, duration: 0.5 }, C.herauskommt);
          tl.to([hiBand, hiBand2], { opacity: 1, duration: 0.4 }, C.hoch_oft);
          tl.to([loBand, loBand2], { opacity: 1, duration: 0.4 }, C.niedrig);
          tl.to([hiBand, hiBand2, loBand, loBand2], { opacity: 0, duration: 0.4 }, C.stapel_zeichnet + 1.0);
          tl.to(histCurve, { opacity: 1, duration: 0.2 }, C.kurve_darueber);
          tl.fromTo(histCurve, { strokeDashoffset: hclen }, { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, C.kurve_darueber);
          tl.fromTo("#wd-passt", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, C.passen);
          tl.to("#wd-steps", { opacity: 0, duration: 0.3 }, C.kurve_darueber - 0.1);
          tl.to("#wd-stage", { opacity: 0, duration: 0.35, ease: "power3.in" }, END - 0.4);

          window.__timelines["wanderer"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
