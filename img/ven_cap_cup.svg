<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Vereinigung und Schnittmenge als Alltagsmetaphern</title>
<desc>Links: zwei Pfeile A und B fliessen in eine Tasse und vermischen sich (Vereinigung). Rechts: ein gruener Klecks A und ein roter Klecks B ueberlappen unter einer Kaeseglocke (Schnittmenge).</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="300" fill="#ffffff"/>

<!-- LEFT: Tasse / cup -->
<line x1="145" y1="38" x2="162" y2="98" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="215" y1="38" x2="198" y2="98" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="140" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">A</text>
<text x="220" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">B</text>

<path d="M128,105 L128,195 Q128,212 145,212 L215,212 Q232,212 232,195 L232,105" fill="none" stroke="#2C2C2A" stroke-width="1.5"/>
<path d="M232,125 Q255,125 255,150 Q255,175 232,175" fill="none" stroke="#2C2C2A" stroke-width="1.5"/>
<path d="M130,128 Q145,122 160,128 Q175,134 190,128 Q205,122 220,128" fill="none" stroke="#2C2C2A" stroke-width="1"/>

<text x="150" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">A</text>
<text x="195" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">B</text>
<text x="165" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">B</text>
<text x="205" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">A</text>
<text x="145" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">A</text>

<text x="180" y="248" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Vereinigung</text>
<text x="180" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">(Tasse / cup)</text>

<!-- RIGHT: Kaeseglocke / cap -->
<path d="M460,180 L460,90 Q460,58 490,58 L560,58 Q590,58 590,90 L590,180" fill="none" stroke="#2C2C2A" stroke-width="1.5"/>

<circle cx="480" cy="185" r="26" fill="#639922"/>
<circle cx="500" cy="180" r="24" fill="#639922"/>
<circle cx="515" cy="190" r="22" fill="#639922"/>

<circle cx="590" cy="185" r="26" fill="#E24B4A"/>
<circle cx="570" cy="180" r="24" fill="#E24B4A"/>
<circle cx="555" cy="190" r="22" fill="#E24B4A"/>

<text x="475" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#27500A">A</text>
<text x="595" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#791F1F">B</text>

<text x="525" y="248" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Schnittmenge</text>
<text x="525" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">(Käseglocke / cap)</text>
</svg>
