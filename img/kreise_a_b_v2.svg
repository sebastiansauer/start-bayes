<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Zwei getrennte Mengen A und B</title>
<desc>Zwei disjunkte Kreise: links vermillion beschriftet A, rechts blau beschriftet B (Okabe-Ito-Palette).</desc>

<rect x="0" y="0" width="680" height="380" fill="#ffffff"/>

<circle cx="165" cy="150" r="140" fill="#F3DCCB" stroke="#D55E00" stroke-width="7"/>
<circle cx="515" cy="150" r="140" fill="#CCE1F0" stroke="#0072B2" stroke-width="7"/>

<text x="165" y="355" text-anchor="middle" font-family="sans-serif" font-size="70" fill="#D55E00">A</text>
<text x="515" y="355" text-anchor="middle" font-family="sans-serif" font-size="70" fill="#0072B2">B</text>
</svg>
