<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!--
    Isometrische Darstellung eines Würfels mit Augenzahlen.
    Vorderfläche = 1, Deckfläche = 2, rechte Seitenfläche = 3
  -->

  <!-- Rückfläche (verdeckte Kanten, dezent gestrichelt) -->
  <polygon points="190,60 350,60 350,220 190,220"
           fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="6,5" opacity="0.5"/>
  <line x1="100" y1="120" x2="190" y2="60" stroke="black" stroke-width="1.5" stroke-dasharray="6,5" opacity="0.5"/>

  <!-- Deckfläche (oben) -->
  <polygon points="100,120 190,60 350,60 260,120"
           fill="#e8e8e8" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  <!-- Augen: 2 (diagonal) -->
  <circle cx="162.5" cy="105" r="9" fill="#1a1a1a"/>
  <circle cx="287.5" cy="75" r="9" fill="#1a1a1a"/>

  <!-- Rechte Seitenfläche -->
  <polygon points="260,120 350,60 350,220 260,280"
           fill="#b8b8b8" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  <!-- Augen: 3 (diagonal) -->
  <circle cx="282.5" cy="145" r="9" fill="#1a1a1a"/>
  <circle cx="305" cy="170" r="9" fill="#1a1a1a"/>
  <circle cx="327.5" cy="195" r="9" fill="#1a1a1a"/>

  <!-- Vorderfläche -->
  <polygon points="100,120 260,120 260,280 100,280"
           fill="#d3d3d3" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  <!-- Auge: 1 (zentriert) -->
  <circle cx="180" cy="200" r="13" fill="#1a1a1a"/>

</svg>
