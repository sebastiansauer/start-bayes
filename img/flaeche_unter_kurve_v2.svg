<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <!-- Fläche S: Kurve von a bis b, dann runter zur x-Achse, zurück -->
  <path d="M 130,90 C 160,90 190,140 220,130 C 250,120 280,70 300,75 L 300,240 L 130,240 Z"
        fill="#d9d9d9" stroke="none"/>

  <!-- x-Achse -->
  <line x1="30" y1="240" x2="370" y2="240" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- y-Achse -->
  <line x1="50" y1="260" x2="50" y2="30" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Senkrechte Linien bei a und b: enden exakt auf der Kurve -->
  <line x1="130" y1="90" x2="130" y2="240" stroke="black" stroke-width="1.5"/>
  <line x1="300" y1="75" x2="300" y2="240" stroke="black" stroke-width="1.5"/>

  <!-- Kurve f(x), durchgehend, über der Fläche gezeichnet -->
  <path d="M 50,110 C 80,70 100,90 130,90 C 160,90 190,140 220,130 C 250,120 280,70 300,75 C 320,78 335,80 350,85"
        fill="none" stroke="black" stroke-width="2"/>

  <!-- Beschriftungen -->
  <text x="60" y="20" font-family="Georgia, serif" font-style="italic" font-size="18">y</text>
  <text x="380" y="245" font-family="Georgia, serif" font-style="italic" font-size="18">x</text>
  <text x="260" y="65" font-family="Georgia, serif" font-style="italic" font-size="18">f(x)</text>
  <text x="205" y="180" font-family="Georgia, serif" font-style="italic" font-size="20">S</text>
  <text x="123" y="258" font-family="Georgia, serif" font-style="italic" font-size="18">a</text>
  <text x="293" y="258" font-family="Georgia, serif" font-style="italic" font-size="18">b</text>
</svg>
