<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1030" width="950" height="1030">
  <!-- Balken: 10 Segmente, abwechselnd grau -->
  <g stroke="#888" stroke-width="3">
    <rect x="3" y="3" width="130" height="102" fill="#808080"/>
    <rect x="3" y="105" width="130" height="102" fill="#e8e8e8"/>
    <rect x="3" y="207" width="130" height="102" fill="transparent"/>
    <rect x="3" y="309" width="130" height="102" fill="#e8e8e8"/>
    <rect x="3" y="411" width="130" height="102" fill="transparent"/>
    <rect x="3" y="513" width="130" height="102" fill="#e8e8e8"/>
    <rect x="3" y="615" width="130" height="102" fill="transparent"/>
    <rect x="3" y="717" width="130" height="102" fill="#e8e8e8"/>
    <rect x="3" y="819" width="130" height="102" fill="transparent"/>
    <rect x="3" y="921" width="130" height="102" fill="#e8e8e8"/>
  </g>
  <!-- Gestrichelte Trennlinien -->
  <g stroke="#888" stroke-width="3" stroke-dasharray="10,8">
    <line x1="3" y1="105" x2="133" y2="105"/>
    <line x1="3" y1="207" x2="133" y2="207"/>
    <line x1="3" y1="309" x2="133" y2="309"/>
    <line x1="3" y1="411" x2="133" y2="411"/>
    <line x1="3" y1="513" x2="133" y2="513"/>
    <line x1="3" y1="615" x2="133" y2="615"/>
    <line x1="3" y1="717" x2="133" y2="717"/>
    <line x1="3" y1="819" x2="133" y2="819"/>
    <line x1="3" y1="921" x2="133" y2="921"/>
  </g>
  <!-- Äußerer Rahmen des Balkens -->
  <rect x="3" y="3" width="130" height="1020" fill="none" stroke="#888" stroke-width="3"/>

  <!-- Pfeil -->
  <line x1="415" y1="512" x2="510" y2="512" stroke="#888" stroke-width="10"/>
  <polygon points="510,490 555,512 510,534" fill="#888"/>

  <!-- Quadrat -->
  <rect x="793" y="457" width="135" height="110" fill="none" stroke="#888" stroke-width="4"/>
</svg>
