<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Zwei überlappende Kreise in einem Rechteck</title>
<desc>Ein schwarz umrandetes Rechteck enthält zwei sich überlappende, rot gefüllte Kreise mit schwarzer Kontur.</desc>

<rect x="20" y="20" width="640" height="360" fill="#ffffff" stroke="#000000" stroke-width="6"/>

<circle cx="270" cy="200" r="150" fill="#D55E00" stroke="none"/>
<circle cx="410" cy="200" r="150" fill="#D55E00" stroke="none"/>
<circle cx="270" cy="200" r="150" fill="none" stroke="#000000" stroke-width="6"/>
<circle cx="410" cy="200" r="150" fill="none" stroke="#000000" stroke-width="6"/>
</svg>
